<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="chat-app">
        <header class="chat-header">
            <h1>CHATBOT</h1>
            <p>Type <strong>course</strong>, <strong>faculty</strong>, or <strong>bye</strong> to get a response.</p>
        </header>

        <section id="chat-box" aria-live="polite"></section>

        <div id="typing-area">
            <input type="text" placeholder="Type something..." id="user-input" autocomplete="off">
            <button type="button" onclick="sendmessage()">Send</button>
        </div>
    </main>

    <script>
        function appendMessage(text, cls) {
            const chatBox = document.getElementById("chat-box");
            const bubble = document.createElement("p");
            bubble.className = cls;
            bubble.textContent = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendmessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, "user");
            input.value = "";

            fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: message })
            })
                .then((response) => response.json())
                .then((data) => {
                    appendMessage(data.response, "bot");
                })
                .catch(() => {
                    appendMessage("Something went wrong. Please try again.", "bot");
                });
        }

        document.getElementById("user-input").addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendmessage();
            }
        });
    </script>
</body>
</html>
